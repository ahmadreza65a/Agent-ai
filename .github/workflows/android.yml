name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract ZIP and Locate Project
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Extracting $z..."
            unzip -o "$z" -x ".github/*"
          done

          PROJECT_FILE=$(find . -maxdepth 3 -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "خطا: فایل settings.gradle.kts در مخزن یا داخل فایل زیپ پیدا نشد!"
            ls -la
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "پروژه در مسیر $PROJECT_DIR پیدا شد."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Agent-APK
          path: "**/app-debug.apk"
